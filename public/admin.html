<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuantX AI — Controllo Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- LOGIN ADMIN -->
  <div id="admin-login" class="auth-wrap">
    <div class="card auth-card">
      <div class="logo" style="margin-bottom:20px">QUANT<span>X</span> <small style="color:var(--muted); font-size:14px">ADMIN</small></div>
      <h2 style="margin-bottom:20px">Accesso riservato</h2>
      <div class="form">
        <div>
          <label class="label">Chiave admin</label>
          <input class="input" id="adm-key" type="password" placeholder="Chiave di accesso" />
        </div>
        <button class="btn btn-primary btn-block" onclick="adminLogin()">Entra nel pannello ⚡</button>
        <p id="adm-error" style="color:#ff5c7a; font-size:14px; text-align:center"></p>
      </div>
    </div>
  </div>

  <!-- PANNELLO -->
  <div id="admin-view" class="container" style="display:none">
    <nav class="nav">
      <div class="logo">QUANT<span>X</span> ADMIN</div>
      <div style="display:flex; gap:12px; align-items:center">
        <span style="color:var(--green); font-size:14px; font-weight:700">● CONTROLLO TOTALE</span>
        <button class="btn btn-ghost" onclick="adminLogout()">Esci</button>
      </div>
    </nav>

    <div class="stats-grid">
      <div class="card stat-card"><div class="num" id="ov-users">0</div><div class="label">Investitori</div></div>
      <div class="card stat-card"><div class="num" id="ov-deposits">€0</div><div class="label">Depositi totali (soldi veri)</div></div>
      <div class="card stat-card"><div class="num" id="ov-balance">€0</div><div class="label">Saldi virtuali totali</div></div>
      <div class="card stat-card"><div class="num" id="ov-pending">0</div><div class="label">Prelievi in verifica</div></div>
    </div>

    <div class="card" style="margin-bottom:20px">
      <h3 style="margin-bottom:16px">⏳ Prelievi in attesa — decidi tu cosa pagare</h3>
      <div id="pend-list"></div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:16px">👥 Investitori — saldo modificabile a piacere</h3>
      <div style="overflow-x:auto">
        <table class="adm-table">
          <thead>
            <tr><th>Email</th><th>Nome</th><th>Saldo</th><th>Depositato</th><th>Piano</th><th>Refer</th><th>Nuovo saldo</th><th></th></tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
