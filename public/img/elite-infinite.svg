<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" preserveAspectRatio="xMidYMid slice">
  <!-- Poster "Infinite": loop metallico con bordo rosso -->
  <defs>
    <radialGradient id="iBg" cx="0.5" cy="0.32" r="1">
      <stop offset="0" stop-color="#18181b"/>
      <stop offset="0.6" stop-color="#0c0c0e"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a41"/>
      <stop offset="0.45" stop-color="#161619"/>
      <stop offset="0.75" stop-color="#0a0a0c"/>
      <stop offset="1" stop-color="#232328"/>
    </linearGradient>
    <linearGradient id="redEdge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8e0c20"/>
      <stop offset="0.55" stop-color="#c8102e"/>
      <stop offset="1" stop-color="#ff4560"/>
    </linearGradient>
    <radialGradient id="fShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="iGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="900" height="1100" fill="url(#iBg)"/>

  <!-- riflettore dall'alto -->
  <path d="M450 0 L 250 340 L 650 340 Z" fill="#ffffff" opacity="0.035"/>

  <!-- infinito -->
  <g transform="translate(450,470)">
    <path d="M-230 0 C -230 -110, -110 -160, -20 -60 L 20 60 C 110 160, 230 110, 230 0 C 230 -110, 110 -160, 20 -60 L -20 60 C -110 160, -230 110, -230 0 Z"
          fill="none" stroke="url(#metal)" stroke-width="92" stroke-linejoin="round"/>
    <path d="M-230 0 C -230 -110, -110 -160, -20 -60 L 20 60 C 110 160, 230 110, 230 0 C 230 -110, 110 -160, 20 -60 L -20 60 C -110 160, -230 110, -230 0 Z"
          fill="none" stroke="url(#redEdge)" stroke-width="10" stroke-linejoin="round" filter="url(#iGlow)" transform="translate(0,-4)"/>
    <path d="M-230 0 C -230 -110, -110 -160, -20 -60 L 20 60 C 110 160, 230 110, 230 0 C 230 -110, 110 -160, 20 -60 L -20 60 C -110 160, -230 110, -230 0 Z"
          fill="none" stroke="url(#redEdge)" stroke-width="10" stroke-linejoin="round" transform="translate(0,-4)"/>
    <!-- riflessi bianchi del metallo -->
    <path d="M-196 66 C -150 120, -70 122, -20 60" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" fill="none"/>
    <path d="M22 54 C 70 118, 150 122, 196 66" stroke="#ffffff" stroke-opacity="0.3" stroke-width="6" fill="none"/>
  </g>

  <!-- pavimento e riflesso -->
  <rect x="0" y="880" width="900" height="220" fill="#08080a"/>
  <rect x="0" y="878" width="900" height="3" fill="#c8102e" opacity="0.5"/>
  <ellipse cx="450" cy="930" rx="330" ry="40" fill="url(#fShadow)"/>
</svg>
